<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Scan cartes Pokémon</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<meta name="theme-color" content="#10161d">
<style>
:root{color-scheme:light dark;--bg:#e9eef3;--ink:#1b2430;--mut:#5b6877;--card:#fff;--line:#c9d3de;--acc:#1f5fbf;box-sizing:border-box}
@media (prefers-color-scheme:dark){:root{--bg:#10161d;--ink:#e8edf2;--mut:#93a1b1;--card:#18212b;--line:#2b3846;--acc:#6aa5ff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 "Avenir Next",system-ui,sans-serif;padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom)}
main{max-width:520px;margin:0 auto;padding:14px 0 40px}
h1{font-size:1.35rem;margin:6px 0 12px;letter-spacing:-.01em}
.cam{position:relative;aspect-ratio:3/4;background:#000;border-radius:14px;overflow:hidden}
.cam video{width:100%;height:100%;object-fit:cover}
.frame{position:absolute;left:50%;top:50%;height:88%;aspect-ratio:63/88;transform:translate(-50%,-50%);border:2px solid rgba(255,255,255,.85);border-radius:10px;box-shadow:0 0 0 999px rgba(0,0,0,.35)}
.row{display:flex;gap:8px;margin:10px 0;flex-wrap:wrap}
button,.btn,input{font:inherit;color:inherit}
button,.btn{border:1px solid var(--line);background:var(--card);padding:11px 14px;border-radius:9px;cursor:pointer;text-align:center}
button.main{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:600;flex:1}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.btn input{display:none}
#st{min-height:1.4em;color:var(--mut);font-size:.92rem}
.manual{display:flex;gap:8px;flex-wrap:wrap}
.manual #ms{flex-basis:56%}
.manual input{flex:1 1 38%;min-width:0;padding:10px;border:1px solid var(--line);border-radius:9px;background:var(--card)}
.res{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:14px;display:grid;grid-template-columns:110px 1fr;gap:14px}
.res img{width:110px;border-radius:6px}
.res h2{margin:0 0 4px;font-size:1.15rem}
.meta{color:var(--mut);font-size:.9rem;margin:2px 0}
.badge{display:inline-block;padding:3px 9px;border-radius:99px;font-size:.82rem;border:1px solid var(--line);margin:6px 6px 0 0}
.badge.foil{border:0;color:#1b2430;background:linear-gradient(100deg,#ffd6e8,#d6e8ff,#d6ffe9,#fff3c4)}
.chips{display:flex;gap:6px;margin-top:8px}
.chips button{padding:6px 11px;font-size:.9rem}
.chips button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.price{grid-column:1/-1;border-top:1px solid var(--line);padding-top:12px}
.big{font-size:2rem;font-weight:700;letter-spacing:-.02em}
.sub{display:flex;gap:18px;color:var(--mut);font-size:.9rem;flex-wrap:wrap}
.alt{margin-top:12px}.alt button{margin:0 6px 6px 0;font-size:.85rem;padding:6px 10px;display:inline-flex;align-items:center;gap:8px;text-align:left}.alt img{width:34px;border-radius:3px;flex:none}
#tl[aria-pressed=true]{background:#f5c542;border-color:#f5c542;color:#1b2430;font-weight:600}
.auto{display:block;margin:2px 0 6px}.frame.ok{border-color:#4ade80}
a{color:var(--acc)}
small{color:var(--mut)}
@media (prefers-reduced-motion:no-preference){.res{animation:in .25s ease-out}@keyframes in{from{opacity:0}to{opacity:1}}}
</style>
</head>
<body>
<main>
<h1>Scan cartes Pokémon</h1>
<div class="cam"><video id="v" playsinline muted></video><div class="frame"></div></div>
<div class="row">
  <button class="main" id="go">Scanner la carte</button>
  <label class="btn">Importer une photo<input type="file" id="f" accept="image/*"></label>
  <button id="tl" type="button" aria-pressed="false" hidden>Lampe</button>
</div>
<label class="auto"><input type="checkbox" id="auto" checked> Scan automatique</label><small id="dbg"></small>
<div id="st" role="status">Cadre la carte dans le rectangle, bien éclairée, sans reflet.</div>
<form class="manual" id="m">
  <input id="mn" placeholder="Nom (anglais)" aria-label="Nom en anglais">
  <input id="mu" placeholder="N° (ex. 45/198)" aria-label="Numéro de carte" inputmode="text">
  <input id="ms" list="sets" placeholder="Extension (ex. Paldea, MEG…)" aria-label="Extension" autocomplete="off">
  <datalist id="sets"></datalist>
  <button>Chercher</button>
</form>
<div id="out"></div>
<p><small>Prix : tendance Cardmarket (€) via pokemontcg.io, toutes langues confondues, mis à jour une fois par jour environ.</small></p>
</main>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const eur=n=>n==null?'—':new Intl.NumberFormat('fr-BE',{style:'currency',currency:'EUR'}).format(n);
const LANGS={FR:'Français',EN:'Anglais',DE:'Allemand',ES:'Espagnol',IT:'Italien',PT:'Portugais'};
const KW={FR:['faiblesse','retraite','talent','dresseur'],EN:['weakness','retreat','ability'],DE:['schwache','ruckzug','fahigkeit','resistenz'],ES:['debilidad','retirada','habilidad','entrenador'],IT:['debolezza','ritirata','abilita','allenatore'],PT:['fraqueza','recuo','habilidade','treinador']};
const norm=t=>t.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
let worker,cur=null,finish='normal',lang=null;
const status=t=>$('#st').textContent=t;

// Lampe torche (affichée seulement si le téléphone/navigateur la permet)
let track=null;
function initTorch(){
  if(!track)return;
  const b=$('#tl');b.hidden=false; // toujours affiché : certains téléphones ne déclarent la lampe qu'après essai
  b.onclick=async()=>{
    const on=b.getAttribute('aria-pressed')!=='true';
    try{
      if(on&&!(track.getCapabilities?.()||{}).torch){
        status('Recherche de la caméra qui a le flash…');
        if(!(await findTorchCamera()))throw new Error('torch');
        status('');
      }
      await track.applyConstraints({advanced:[{torch:on}]});
      const st=(track.getSettings?.()||{}).torch,caps=track.getCapabilities?.()||{};
      if((st!==undefined&&st!==on)||(!caps.torch&&st===undefined))throw new Error('torch');
      b.setAttribute('aria-pressed',on);b.textContent=on?'Lampe allumée':'Lampe';
    }catch(e){status('Aucune caméra de ce téléphone n’expose la lampe au navigateur (c’est le cas de certains modèles ou navigateurs). Éclaire la carte avec une lampe externe.')}
  };
}
// Beaucoup de téléphones ont plusieurs objectifs "arrière" et seul le principal a le flash :
// on teste chaque caméra arrière jusqu'à en trouver une qui expose la lampe.
async function findTorchCamera(){
  const md=navigator.mediaDevices;
  const devs=(await md.enumerateDevices()).filter(d=>d.kind==='videoinput'&&d.deviceId);
  const back=devs.filter(d=>/back|rear|arri|environment/i.test(d.label));
  const old=$('#v').srcObject;old?.getTracks().forEach(x=>x.stop());
  for(const d of(back.length?back:devs)){
    let s;
    try{s=await md.getUserMedia({video:{deviceId:{exact:d.deviceId},width:{ideal:1920}}})}catch(e){continue}
    const t=s.getVideoTracks()[0];
    if((t.getCapabilities?.()||{}).torch){track=t;$('#v').srcObject=s;$('#v').play();return true}
    s.getTracks().forEach(x=>x.stop());
  }
  try{ // aucune caméra avec lampe : on remet la caméra d'origine
    const s=await md.getUserMedia({video:{facingMode:'environment',width:{ideal:1920}}});
    track=s.getVideoTracks()[0];$('#v').srcObject=s;$('#v').play();
  }catch(e){}
  return false;
}
// Caméra
navigator.mediaDevices?.getUserMedia({video:{facingMode:'environment',width:{ideal:1920}}}).then(s=>{track=s.getVideoTracks()[0];$('#v').addEventListener('playing',initTorch,{once:true});initTorch();$('#v').srcObject=s;$('#v').play()}).catch(()=>status('Caméra indisponible : utilise « Importer une photo ».'));

function cropRect(){
  const v=$('#v'),vw=v.videoWidth,vh=v.videoHeight;if(!vw)return null;
  let w=vw,h=vh,x=0,y=0;
  if(vw/vh>.75){w=vh*.75;x=(vw-w)/2}else{h=vw/.75;y=(vh-h)/2}
  const ch=h*.88,cw=ch*63/88;return[x+(w-cw)/2,y+(h-ch)/2,cw,ch];
}
function frameCanvas(){
  const r=cropRect();if(!r)return null;
  const c=document.createElement('canvas');c.width=r[2];c.height=r[3];
  c.getContext('2d').drawImage($('#v'),...r,0,0,r[2],r[3]);return c;
}

// Détection automatique : carte présente (assez de contraste et de netteté) et immobile ~1 s
const DEBUG=location.search.includes('debug');
const T={mean:35,sd:28,lap:40,still:4,move:8,change:7,frames:3}; // seuils à ajuster avec ?debug
const sm=document.createElement('canvas');sm.width=96;sm.height=134;
const sx=sm.getContext('2d',{willReadFrequently:true});
let prev=null,ref=null,failAt=0,fails=0,still=0,armed=true,busy=false;
function metrics(){
  const r=cropRect();if(!r)return null;
  sx.drawImage($('#v'),...r,0,0,96,134);
  const d=sx.getImageData(0,0,96,134).data,g=new Float32Array(96*134);
  let mean=0;
  for(let i=0;i<g.length;i++){g[i]=.299*d[i*4]+.587*d[i*4+1]+.114*d[i*4+2];mean+=g[i]}
  mean/=g.length;
  let vr=0,lap=0,n=0;
  for(let y=1;y<133;y++)for(let x=1;x<95;x++){const i=y*96+x;vr+=(g[i]-mean)**2;const l=4*g[i]-g[i-1]-g[i+1]-g[i-96]-g[i+96];lap+=l*l;n++}
  let diff=99;
  if(prev){diff=0;for(let i=0;i<g.length;i++)diff+=Math.abs(g[i]-prev[i]);diff/=g.length}
  prev=g;
  return{mean,sd:Math.sqrt(vr/n),lap:lap/n,diff,g};
}
const meanAbs=(a,b)=>{let s=0;for(let i=0;i<a.length;i++)s+=Math.abs(a[i]-b[i]);return s/a.length};
setInterval(async()=>{
  if(!$('#auto').checked||busy)return;
  const m=metrics();if(!m)return;
  const looks=m.mean>T.mean&&m.sd>T.sd&&m.lap>T.lap,calm=m.diff<T.still;
  $('.frame').classList.toggle('ok',looks&&calm);
  if(DEBUG)$('#dbg').textContent=`lum ${m.mean|0} · contraste ${m.sd|0} · netteté ${m.lap|0} · mvt ${m.diff|0} · ${armed?'prêt':'attente'}`;
  if(!armed){
    const dr=ref?meanAbs(m.g,ref):99;
    // nouvelle carte : carte retirée, mouvement, ou image stable mais différente de celle scannée
    if(!looks||m.diff>T.move||(dr>T.change&&calm)){armed=true;still=0;fails=0;failAt=0}
    // échec de lecture : on retente au plus 2 fois si la carte reste en place
    else if(failAt&&fails<2&&calm&&Date.now()-failAt>2500){armed=true;still=0}
    return;
  }
  still=looks&&calm?still+1:0;
  if(still>=T.frames){armed=false;still=0;ref=m.g;status('Carte détectée, lecture…');const c=frameCanvas();if(c)await scan(c)}
},250);
$('#go').onclick=()=>{const c=frameCanvas();c?scan(c):status('La caméra n’est pas prête.')};
$('#f').onchange=e=>{const file=e.target.files[0];if(!file)return;const img=new Image();img.onload=()=>{const c=document.createElement('canvas');c.width=img.width;c.height=img.height;c.getContext('2d').drawImage(img,0,0);scan(c)};img.src=URL.createObjectURL(file)};

// OCR rapide : 2 lecteurs "eng" (chiffres) en parallèle, préchargés au démarrage.
// Le lecteur multilingue (pour la langue) ne se charge qu'en arrière-plan, après l'affichage du prix.
let scanId=0,shownScan=0,poolP=null,langP=null;
const NUM='0123456789/ABCDEFGHIJKLMNOPQRSTUVWXYZ ';
const F={a:'grayscale(1) contrast(1.6)',b:'grayscale(1) brightness(.75) contrast(2.3)',i:'grayscale(1) invert(1) contrast(1.8)'};
// [x début, x fin, y début, échelle, filtre] : coins du bas (le numéro est en bas à gauche ou à droite), puis anti-reflet, puis bande complète
const ROUNDS=[
  [[0,.55,.86,2,'a'],[.45,1,.86,2,'a']],
  [[0,.55,.84,2.5,'i'],[.45,1,.84,2.5,'i']],
  [[0,.55,.84,2.5,'b'],[.45,1,.84,2.5,'b']],
  [[0,1,.8,3,'a'],[0,1,.8,3,'i']]
];
async function mk(langs,params){const w=await Tesseract.createWorker(langs,1);await w.setParameters(params);return w}
function getPool(){
  if(!poolP){
    poolP=(async()=>{
      const s=Tesseract.createScheduler(),n=Math.min(2,navigator.hardwareConcurrency||2);
      const ws=await Promise.all(Array.from({length:n},()=>mk('eng',{tessedit_char_whitelist:NUM,tessedit_pageseg_mode:'11'})));
      ws.forEach(w=>s.addWorker(w));return s;
    })();
    poolP.catch(()=>{poolP=null});
  }
  return poolP;
}
getPool().catch(()=>{}); // préchargement dès l'ouverture de la page
function crop(c,x0,x1,y0,scale,filter){
  const x=Math.round(c.width*x0),w=Math.round(c.width*(x1-x0)),y=Math.round(c.height*y0),h=c.height-y;
  const s=document.createElement('canvas');s.width=Math.round(w*scale);s.height=Math.round(h*scale);
  const g=s.getContext('2d');g.filter=filter;g.drawImage(c,x,y,w,h,0,0,s.width,s.height);return s;
}
async function scan(canvas){
  if(busy)return;busy=true;let ok=false;const id=++scanId;let info={},all='';
  try{
    status('Lecture du numéro…');
    const sch=await getPool();
    const codes=[];
    for(let r=0;r<ROUNDS.length;r++){const round=ROUNDS[r];
      const txt=(await Promise.all(round.map(([x0,x1,y0,sc,f])=>sch.addJob('recognize',crop(canvas,x0,x1,y0,sc,F[f]))))).map(x=>x.data.text);
      all+=' '+txt.join(' ').replace(/\s+/g,' ');
      const ps=txt.map(parse),best=ps.find(p=>p.number&&p.total)||ps.find(p=>p.number);
      if(best&&(!info.number||(best.total&&!info.total)))info=best;
      for(const p of ps)if(p.number)for(const c of p.codes)if(!codes.includes(c))codes.push(c);
      if(info.number&&info.total&&(codes.length||r>=1))break;
    }
    const pc=parse(all);info.lang??=pc.lang;
    if(!info.number){status('Numéro illisible. Rapproche la carte, incline-la pour éviter les reflets, ou saisis le numéro ci-dessous. (texte lu : « '+all.trim().slice(0,90)+' »)');return}
    lang=info.lang||null;
    status('Lu : n° '+info.number+'/'+(info.total||'?')+(codes[0]?' · extension '+codes[0]:'')+' — recherche du prix…');
    ok=await search({...info,codes,canvas});if(ok)shownScan=id;
    if(ok&&!lang)detectLang(canvas,id); // en arrière-plan : ne retarde pas le prix
  }catch(e){status('Lu : n° '+(info.number||'?')+'/'+(info.total||'?')+' — '+e.message)}
  finally{busy=false;if(ok){fails=0;failAt=0}else{fails++;failAt=Date.now()}}
}
async function detectLang(canvas,id){
  try{
    if(!langP){langP=mk('eng+fra+deu+spa+ita+por',{tessedit_pageseg_mode:'6'});langP.catch(()=>{langP=null})}
    const w=await langP;
    const t=(await w.recognize(crop(canvas,0,1,.55,1.5,'grayscale(1) contrast(1.4)'))).data.text;
    if(id!==shownScan)return; // la langue ne s'applique qu'à la carte actuellement affichée
    const l=parse(t).lang;
    if(l){lang=l;if(cur)render()}
  }catch(e){}
}
function parse(t){
  const T=t.toUpperCase();
  // 1) numéro bien lu : 095/086, 45/198, TG12/TG30
  let m=T.match(/\b([A-Z]{0,3}\d{1,3})\s*\/\s*([A-Z]{0,3}\d{1,3})\b/),number=null,total=null,at=-1;
  if(m){number=m[1];total=m[2];at=m.index}
  else{ // 2) barre mal lue (souvent 7, 1, I ou |) ou absente : 0957086 -> 095/086
    const k=T.match(/(0\d{2})[\/71I|L ]?(0\d{2})/)||T.match(/(?<!\d)(\d{3})[\/71I|L ]?(\d{3})\d{0,2}(?!\d)/); // d'abord le format SV (095/086), sinon 3+3 chiffres
    if(k&&+k[2]>=10){number=k[1];total=k[2];at=k.index}
  }
  // langue + code d'extension : « CRI FR 095/086 », cadre et espaces tolérés
  const cb=T.match(/\b([A-Z0-9]{2,4})[\s|\[\]]{0,3}(EN|FR|DE|ES|IT|PT)[\s|\[\]•.*]{0,5}[A-Z]{0,3}\d{1,3}\s*\/\s*[A-Z]{0,3}\d{1,3}/);
  const cl=cb||T.match(/\b([A-Z0-9]{2,4})[\s|\[\]]{1,3}(EN|FR|DE|ES|IT|PT)\b/);
  let l=cl?cl[2]:null;
  if(!l){const n=norm(t);let best=0;for(const k in KW){const sc=KW[k].filter(w=>n.includes(w)).length;if(sc>best){best=sc;l=k}}}
  // codes possibles : celui trouvé avec la langue, sinon les mots de 3 caractères juste avant le numéro
  const codes=[];
  if(cl)codes.push(cl[1]);
  if(at>0){
    const before=T.slice(Math.max(0,at-26),at).match(/\b[A-Z0-9]{3}\b/g)||[];
    for(const w of before.reverse())if(/[A-Z]/.test(w)&&!/^(EN|FR|DE|ES|IT|PT)$/.test(w)&&!codes.includes(w))codes.push(w);
  }
  return{number:number&&number.replace(/^([A-Z]*)0+(?=\d)/,'$1'),total:total&&total.replace(/^0+(?=\d)/,''),code:codes[0]||null,codes:codes.slice(0,3),lang:l};
}

// Recherche pokemontcg.io
async function api(url,n=2){
  for(let i=0;i<n;i++){
    try{
      const c=new AbortController(),t=setTimeout(()=>c.abort(),10000);
      const r=await fetch(url,{signal:c.signal});clearTimeout(t);
      if(r.ok){const j=await r.json().catch(()=>null);if(j)return j}
    }catch(e){}
    status('Le serveur de prix est lent, nouvel essai ('+(i+1)+'/'+n+')…');
    await new Promise(r=>setTimeout(r,1500));
  }
  throw new Error('le serveur de prix (pokemontcg.io) ne répond pas pour le moment : le numéro est bien lu, réessaie dans quelques minutes ou saisis la carte à la main.');
}
const apiCache=new Map();
// Liste des extensions (chargée quand on touche le champ « Extension »)
let SETS=[];
async function loadSets(){
  if(SETS.length)return;
  try{
    const j=await api('https://api.pokemontcg.io/v2/sets?select=id,name,series,ptcgoCode,releaseDate&orderBy=-releaseDate',1);
    SETS=j.data||[];
    $('#sets').innerHTML=SETS.map(s=>`<option value="${esc(s.name)}">${esc(s.series)}${s.ptcgoCode?' · '+esc(s.ptcgoCode):''}</option>`).join('');
    status('');
  }catch(e){status('')}
}
$('#ms').addEventListener('focus',loadSets);
function findSet(txt){
  const v=txt.trim().toLowerCase();if(!v)return{};
  const s=SETS.find(x=>[x.name,x.ptcgoCode,x.id].some(k=>k&&k.toLowerCase()===v));
  return s?{setId:s.id}:{setName:txt.trim()};
}
async function search({number,total,code,codes:cands,name,setId,setName,canvas}){
  if(!number&&!name){status('Saisis au moins un nom ou un numéro (avec l’extension si tu veux).');return false}
  status('Recherche du prix…');
  const base=[];
  if(number)base.push(`number:"${number}"`);
  if(name)base.push(`name:"${name}*"`);
  const get=async parts=>{
    const url='https://api.pokemontcg.io/v2/cards?pageSize=12&select=id,name,number,rarity,set,images,cardmarket&q='+encodeURIComponent(parts.join(' '));
    let j=apiCache.get(url);if(!j){j=await api(url);apiCache.set(url,j)} // une carte déjà vue s'affiche instantanément
    return j.data||[];
  };
  // extension : choisie à la main, sinon le code imprimé sur la carte (ex. CRI)
  const fix=c=>c.replace(/0/g,'O').replace(/1/g,'I').replace(/5/g,'S').replace(/8/g,'B');
  const codes=[...new Set([...(cands||[]),code].filter(Boolean).flatMap(c=>[c,fix(c)]))].slice(0,4);
  let d=[],matched=null,used=null;
  if(setId||setName){d=await get([setId?`set.id:${setId}`:`set.name:"${setName.replace(/"/g,'')}*"`,...base]);matched='manual'}
  else for(const c of codes){d=await get([`set.ptcgoCode:${c}`,...base]);if(d.length){matched='code';used=c;break}}
  if(!d.length&&!setId&&!setName){ // code absent ou inconnu de la base de prix : numéro + total imprimé
    const q=[...base];if(total&&/^\d+$/.test(total))q.push(`set.printedTotal:${total}`);
    d=await get(q);matched='total';
  }
  if(!d.length){status('Aucune carte trouvée. Vérifie le numéro ou cherche par nom.');return false}
  window._read=canvas?{code:matched==='code'?used:(cands&&cands[0])||code,raw:`${number}/${total||'?'}`,matched}:null; // ce qui a été lu sur la carte
  status('');show(d[0],d);return true;
}
$('#m').onsubmit=e=>{e.preventDefault();const u=$('#mu').value.match(/([A-Za-z]{0,3}\d{1,3})\s*\/?\s*(\d{1,3})?/);
  scanId++;shownScan=-1;lang=null;search({...findSet($('#ms').value),name:$('#mn').value.trim(),number:u&&u[1].replace(/^([A-Za-z]*)0+(?=\d)/,'$1'),total:u&&u[2]})};

// Affichage
const intrinsicFoil=c=>!['Common','Uncommon','Rare','Promo',undefined].includes(c.rarity);
const csearch=c=>'https://www.cardmarket.com/fr/Pokemon/Products/Search?searchString='+encodeURIComponent(c.name+' '+c.number);
async function enrich(c){
  try{
    const list=await api('https://api.tcgdex.net/v2/en/cards?name='+encodeURIComponent(c.name)+'&localId='+encodeURIComponent(c.number),1);
    for(const b of list.slice(0,8)){
      const d=await api('https://api.tcgdex.net/v2/en/cards/'+encodeURIComponent(b.id),1);
      const m=d.pricing?.cardmarket;
      if(m&&d.set?.cardCount?.official==c.set.printedTotal){
        c.cardmarket={url:'',updatedAt:(m.updated||'').slice(0,10),prices:{trendPrice:m.trend,lowPrice:m.low,avg30:m.avg30,averageSellPrice:m.avg,reverseHoloTrend:m['trend-holo'],reverseHoloLow:m['low-holo'],reverseHoloAvg30:m['avg30-holo'],reverseHoloSell:m['avg-holo']}};
        return true;
      }
    }
  }catch(e){}
  return false;
}
async function show(c,all){
  cur=c;finish='normal';render(all);
  if(!c.cardmarket?.prices){
    status('Prix absent, recherche dans une autre source…');
    if(await enrich(c)){render(all)}
    status('');
  }
}
function render(all=window._all){
  window._all=all;const c=cur,p=c.cardmarket?.prices,foil=intrinsicFoil(c),hasRev=!foil&&p?.reverseHoloTrend>0;
  const v=finish==='reverse'?{t:p.reverseHoloTrend,l:p.reverseHoloLow,a:p.reverseHoloAvg30,s:p.reverseHoloSell}:p&&{t:p.trendPrice,l:p.lowPrice,a:p.avg30,s:p.averageSellPrice};
  const isFoil=foil||finish==='reverse';
  $('#out').innerHTML=`<div class="res"><img src="${esc(c.images.small)}" alt="${esc(c.name)}">
  <div><h2>${esc(c.name)}</h2>
  <div class="meta">Extension : <b>${esc(c.set.name)}</b> (${esc(c.set.series)}, ${esc(c.set.releaseDate?.slice(0,4))})</div>
  <div class="meta">N° ${esc(c.number)}/${esc(c.set.printedTotal)} · ${esc(c.rarity||'Rareté inconnue')}</div>
  <span class="badge">Langue : ${lang?LANGS[lang]:'non détectée'}</span>
  <span class="badge ${isFoil?'foil':''}">${foil?'Foil (holo de base)':finish==='reverse'?'Foil (reverse holo)':'Non foil'}</span>
  ${window._read?`<div class="meta">Lu sur la carte : extension <b>${esc(window._read.code||'non lue')}</b> · n° <b>${esc(window._read.raw)}</b>${window._read.matched==='total'?(window._read.code?' · ce code est inconnu de la base de prix, extension déduite du total : vérifie-la':' · extension non lue, déduite du total : vérifie-la'):''}</div>`:''}
  ${hasRev?`<div class="chips" role="group" aria-label="Finition"><button aria-pressed="${finish==='normal'}" data-f="normal">Normale</button><button aria-pressed="${finish==='reverse'}" data-f="reverse">Reverse holo</button></div>`:''}
  </div>
  <div class="price">${v?`<div class="big">${eur(v.t)}</div><div class="sub"><span>Dès ${eur(v.l)}</span><span>Moy. 30 j ${eur(v.a)}</span><span>Moy. vente ${eur(v.s)}</span></div>
  <p class="meta">Tendance Cardmarket · maj ${esc(c.cardmarket.updatedAt)} · <a href="${esc(c.cardmarket.url||csearch(c))}" target="_blank" rel="noopener">Voir sur Cardmarket</a></p>`:`<p class="meta">Aucun prix trouvé (extension très récente ?). <a href="${esc(csearch(c))}" target="_blank" rel="noopener">Chercher sur Cardmarket</a></p>`}</div></div>
  ${all&&all.length>1?`<div class="alt"><small>Autres correspondances, touche celle qui ressemble à ta carte :</small><br>${all.map((x,i)=>x===c?'':`<button data-i="${i}"><img src="${esc(x.images.small)}" alt="">${esc(x.name)} · ${esc(x.set.name)}</button>`).join('')}</div>`:''}`;
}
$('#out').onclick=e=>{const b=e.target.closest('button');if(!b)return;
  if(b.dataset.f){finish=b.dataset.f;render()}
  else if(b.dataset.i){cur=window._all[b.dataset.i];finish='normal';render()}};
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
